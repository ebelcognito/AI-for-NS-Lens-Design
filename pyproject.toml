[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nslens"
version = "0.1.0"
description = "Non-sequential lens design: parametric elements, QD search, differentiable refinement"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "scikit-learn>=1.3",
]

# torch is optional: only ns_autodiff / nslens.refine need it, and the CUDA build
# should be chosen deliberately rather than resolved by a solver.
#   pip install -e ".[autodiff]"
[project.optional-dependencies]
autodiff = ["torch>=2.5"]
# Neural optical-token encoder and continuous Qwen action head. Choose the CUDA
# torch build explicitly; the pretrained loader uses the locally cached NF4 model.
optical-adapter = ["torch>=2.5", "transformers>=5.15,<6", "accelerate>=1.15", "bitsandbytes>=0.50"]
bridge = ["paramiko>=4,<6"]
patents = ["beautifulsoup4>=4.12,<5"]
# Official released EvoTF runtime.  These versions reproduce the adapter/checkpoint
# provenance documented in nslens.search.evotf_emitter.  Accelerator-specific JAX may
# instead be installed with evosax==0.3.1 first, then `pip install -e . --no-deps`.
evotf = [
    "evosax==0.3.1",
    "jax==0.6.2",
    "jaxlib==0.6.2",
    "flax==0.10.7",
    "optax==0.2.5",
]

[project.scripts]
codev-bridge = "codev_bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["nslens*", "codev_bridge*"]

[tool.setuptools.package-data]
"nslens.patent_catalog" = ["searches.json"]

# ---------------------------------------------------------------------------
# Environment note
#
# This project has been run with /home/hisham26/Desktop/simu1/deeplens_env, a venv
# whose name is a leftover from an unrelated project -- there is no "deeplens"
# package anywhere in this repo, only ~10 docstrings quoting that interpreter path.
# It is, however, the only interpreter here with torch (2.5.1+cu121), so it cannot
# simply be deleted.
#
# To retire the name:
#   python3.12 -m venv .venv && . .venv/bin/activate
#   pip install -e ".[autodiff]"
# then update the `PY=` lines in the remaining script docstrings.
#
# The engine also needs Node.js and ray-optics' deps:
#   cd ray-optics && npm ci
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
