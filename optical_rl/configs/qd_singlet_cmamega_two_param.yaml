qd:
  lens_path: /home/hisham26/Desktop/RL/DeepLens/datasets/lenses/singlet/example1.json
  results_dir: results/models
  run_name: singlet_cmamega_two_param

  object_depth_mm: -1000.0
  wavelength_um: 0.587

  # 2D theta: [c1, c2] — both curvatures are free.
  # d_sensor is derived by placing the sensor at the paraxial back focus.
  # The target EFL is NOT enforced; the system focuses wherever (c1, c2) implies.
  theta_bounds:
    - [-0.5, 0.5]   # c1  front surface curvature
    - [-0.5, 0.5]   # c2  rear  surface curvature

  # focal_length_target_mm is unused by TwoParamSingletProblem (BFL solve only).
  focal_length_target_mm: null

  # Two 1-based Noll Zernike indices to use as archive behavioral descriptors.
  # (4, 11)  defocus + primary spherical  — good starting point for 2-param singlet
  # (5, 11)  oblique astigmatism + primary spherical
  # (11, 16) primary spherical + secondary coma
  descriptor_zernike_indices: [7, 5]

  archive_bins: [512, 512]
  archive_bounds: null   # auto-calibrated from random 2D sweep

  invalid_tol: 0.05
  invalid_penalty_weight: 5.0

  cma_eta: 20
  initial_sigma: 1.0
  population_size: 64
  seed: 0

  seed_count: 500
  calibration_count: 1000
  iterations: 3500

  num_rays: 256
  stage: stage1
  stage2_field_deg: 1.0
  # Field angle (degrees) for Zernike OPD measurement. 0.0 = on-axis (default).
  # Set to e.g. 2.0 to activate off-axis coherent trace so that coma/astigmatism are meaningful.
  zernike_field_deg: 2.0

  device: auto
  log_every: 5
