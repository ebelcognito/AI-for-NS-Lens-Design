qd:
  lens_path: /home/hisham26/Desktop/RL/DeepLens/datasets/lenses/camera/ef50mm_f1.8.json
  results_dir: results/models
  run_name: ef50_zernike

  object_depth_mm: -20000.0
  wavelength_um: 0.587

  # Wavelengths for polychromatic RMS spot fitness (Fraunhofer C, d, F lines).
  fitness_wavelengths_um: [0.656, 0.587, 0.486]

  # Index of the aperture-stop surface in the JSON surface list (0-based).
  # Surface 6 is the Stop in ef50mm_f1.8.json.
  stop_surface_index: 6
ow
  # Fix EFL to 50.52 mm.  c11 (rear element 5) is derived from the paraxial
  # solve, so theta is 10-D: [c0,c1,c2,c3,c4,c5,c7,c8,c9,c10].
  # d_sensor follows automatically.  Set to null to revert to free 11-D mode.
  focal_length_target_mm: 50.52

  theta_bounds:
      # Element 1 (positive meniscus, front group power)
      - [-0.06, 0.065]    # c0   ref=+0.029, strong positive
      - [-0.035, 0.035]   # c1   ref=+0.004, weak/near-flat

      # Element 2 (positive element, front group)
      - [-0.08, 0.080]    # c2   ref=+0.046, strong positive
      - [-0.060, 0.060]   # c3   ref=+0.025, moderate positive

      # Element 3 (negative element, front group - flint)
      - [-0.045, 0.045]   # c4   ref=+0.013, weak positive
      - [-0.090, 0.090]    # c5   ref=+0.065, strong positive

      # Cemented doublet (rear group - this is the correction group)
      - [-0.090, 0.090]  # c7   ref=-0.063, strong negative
      - [-0.045, 0.045]   # c8   ref=+0.007, weak (cemented interface)
      - [-0.080, 0.080]  # c9   ref=-0.047, strong negative

      # Element 5 (rear positive element)
      - [-0.040, 0.040]   # c10  ref=+0.006, weak positive
      # c11 derived

  # Two 1-based Noll Zernike indices used as archive behavioral descriptors.
  # (7, 11) = vertical coma + primary spherical — dominant for fast f/1.8 lenses.
  descriptor_zernike_indices: [7, 11]

  archive_bins: [100, 100]
  archive_bounds: null    # null → auto-calibrated from random design sweep

  invalid_tol: 0.05
  invalid_penalty_weight: 5.0

  # When true, designs whose entrance pupil cannot be computed (front group is
  # degenerate / fails ray-tracing intersection) get a -1e9 penalty fitness
  # instead of silently falling back to surfaces[0].r.  Prevents these
  # "phantom" designs from poisoning the archive with misleadingly competitive
  # scores.  Applies to seeding, calibration, AND CMA-MEGA iterations.
  strict_entrance_pupil: true 

  # Number of parallel worker processes used for seeding/calibration in
  # ef50_zernike_parallel.py.  null = auto-detect (~6 per GPU, capped).
  # Ignored by ef50_zernike.py (sequential).
  parallel_workers: 20

  # L2 Zernike distance below which two converged designs count as the same basin.
  dist_threshold: 0.003

  cma_eta: 0.1
  initial_sigma: 0.75
  # CMA-MEGA population per generation. With parallel_workers: 20 below,
  # population_size: 20 means each generation dispatches exactly one batch
  # of 20 candidate evaluations across all 20 workers (round-robin across
  # both GPUs via PersistentEvalPool), fully soaking the pool. The CMA-ES
  # recommended minimum for 3-D coefficient space is 7, so 20 is plenty.
  # Bump higher (e.g. 40, 60) for more samples per gen if you want more
  # aggressive CMA updates — wallclock per gen scales as
  #   ~0.8s parent grad + ceil(lambda/num_workers) * ~0.27s + dispatch.
  population_size: 20
  seed: 0

  seed_count: 100
  calibration_count: 500
  iterations: 10000

  num_rays: 1000
  refine_num_rays: 1000   # rays used during L-BFGS-B refinement

  # Fitness evaluation stage.
  # "stage1" = on-axis RMS spot only (faster, good for initial exploration).
  # "stage2" = mean RMS spot over 3 meridional field points (0, 0.5, 1.0 × HFOV).
  # HFOV is computed per-individual from paraxial EFL and sensor size.
  stage: stage2

  # Which hfov3 field position to use for Zernike OPD measurement:
  #   0 = on-axis, 1 = mid-field (0.5 × HFOV), 2 = full-field (HFOV)
  zernike_field_index: 1

  # Intersection loss (soft penalty for surfaces too close or overlapping)
  intersect_penalty_weight: 1.0
  air_min_mm: 0.1
  thick_min_mm: 1.0

  device: cuda
  log_every: 5
  # Log each MAP-Elites archive insert during seeding (set false to reduce stdout).
  log_seed_accepts: true

  # Stop-and-go checkpointing. Every checkpoint_every CMA-MEGA generations
  # the runner pickles a CMAMEGACheckpoint into <run_dir>/checkpoint.pkl
  # (atomically, via .tmp + rename) so SIGINT mid-write cannot corrupt it.
  # The same file is also written on natural completion and on Ctrl-C.
  # Resume with: python -m optical_rl.qd.ef50_zernike_parallel \
  #              --config <yaml> --resume <existing_run_dir>
  # Resume restores the archive, the canonical CMA-ES emitter state
  # (mean, C, sigma, p_sigma, p_c, generation, RNG), and the runner
  # counters (completed evals, generation, restart count, wallclock).
  # The trajectory.csv in the run directory grows one row per generation
  # and is independent of the checkpoint — it survives kills directly.
  # 0 disables mid-run snapshots; the final checkpoint is always written.
  checkpoint_every: 50

  # Two-tier improvement-rank bonus added to candidate fitness in CMA-MEGA
  # tell() when the candidate filled a previously-empty archive cell.
  # Implements canonical CMA-MEGA's ranking: new cells > replaced elites > none.
  # Only affects sorting inside the inner CMA-ES; never stored in the archive.
  new_cell_bonus: 1.0e6

  # Rendering filter: keep designs with RMS spot <= this value (mm).
  render_min_fitness: -1.0
