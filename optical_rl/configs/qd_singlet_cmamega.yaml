qd:
  lens_path: /home/hisham26/Desktop/RL/DeepLens/datasets/lenses/singlet/example1.json
  results_dir: results/models
  run_name: singlet_cmamega

  object_depth_mm: -1000.0
  wavelength_um: 0.587

  # 1D theta: [c1] only — c2 and d_sensor are derived by paraxial solve.
  theta_bounds:
    - [-0.1, 0.1]

  # Target effective focal length (mm). Omit (null) to use the value from the lens JSON.
  focal_length_target_mm: null

  # Two 1-based Noll Zernike indices to use as archive behavioral descriptors.
  # See optical_rl/qd/singlet_zernike_measures.py for the full term table.
  #   (4, 11)  defocus + primary spherical          <- default, good for on-axis singlet
  #   (11, 16) primary spherical + secondary coma
  #   (7, 11)  vertical coma + primary spherical     <- useful when off-axis field added
  #   (5, 11)  oblique astigmatism + primary spherical
  descriptor_zernike_indices: [5, 8]

  archive_bins: [256, 256]
  archive_bounds: null

  invalid_tol: 0.05
  invalid_penalty_weight: 5.0

  cma_eta: 20
  initial_sigma: 0.75
  population_size: 64
  seed: 0

  seed_count: 500
  calibration_count: 1000
  iterations: 10000

  num_rays: 256
  stage: stage1
  stage2_field_deg: 2.0

  device: auto
  log_every: 5
