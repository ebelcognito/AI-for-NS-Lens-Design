# ============================================================================
# Experiment D: Power-budget reparameterization
# ============================================================================
# CMA-MEGA searches in "power fraction" space instead of curvature space.
# Each theta_i controls what fraction of total system power (1/50mm) surface i
# carries.  Fractions are normalised to sum to 1, then converted to curvatures
# via c_i = (f_i * P_total) / delta_n_i.
#
# Theta bounds are wider than curvature experiments because we're in a
# different space.  Negative values represent negative elements.
# A soft EFL penalty handles the thick-lens residual.

experiment:
  type: power_budget
  efl_target_mm: 50.0
  efl_penalty_weight: 5.0

problem:
  kind: lens
  lens_path: DeepLens/datasets/lenses/cooke.json
  wavelength_um: 0.587
  fitness_wavelengths_um: [0.656, 0.587, 0.486]
  object_depth_mm: -20000.0
  stop_surface_index: 4
  free_curvature_indices: [0, 1, 2, 3, 5, 6]
  derived_curvature_index: null
  focal_length_target_mm: null
  theta_bounds:
    - [-2.0, 2.0]    # power fraction for c0
    - [-2.0, 2.0]    # power fraction for c1
    - [-2.0, 2.0]    # power fraction for c2
    - [-2.0, 2.0]    # power fraction for c3
    - [-2.0, 2.0]    # power fraction for c5
    - [-2.0, 2.0]    # power fraction for c6
  stage: stage2
  num_rays: 512
  invalid_tol: 0.20
  invalid_penalty_weight: 5.0
  intersect_penalty_weight: 1.0
  air_min_mm: 0.1
  thick_min_mm: 0.5
  strict_entrance_pupil: true
  descriptor_field_index: 0

descriptor:
  kind: zernike
  params:
    noll_indices: [7, 11]
    num_rays: 512

algorithm:
  population_size: 16
  initial_sigma: 0.75
  cma_eta: 0.05
  cma_seed: 0
  seed_count: 1024
  calibration_count: 2048
  iterations: 4000
  new_cell_bonus: 1.0e6
  log_every: 50

archive:
  bins: [64, 64]
  bounds: null
  bound_calibration_pad: 0.05

io:
  results_dir: results/focal_experiments
  run_name: triplet_power_budget
  checkpoint_every: 100
  device: auto
