# ============================================================================
# Experiment A: Mid-surface solve (surface 3 derived instead of surface 6)
# ============================================================================
# Surface 3 is the rear surface of the 2nd element (between 2nd and 3rd
# elements).  It sits near the middle of the triplet, so it distributes the
# compensation burden more evenly compared to always using the last surface.
#
# Surfaces 0, 1, 2, 5, 6 are free.  Surface 3 is derived (solved for EFL).

experiment:
  type: mid_solve
  mid_solve_surface_index: 3
  efl_target_mm: 50.0

problem:
  kind: lens
  lens_path: DeepLens/datasets/lenses/cooke.json
  wavelength_um: 0.587
  fitness_wavelengths_um: [0.656, 0.587, 0.486]
  object_depth_mm: -20000.0
  stop_surface_index: 4
  # Surface 3 is derived (mid-solve), not free.  Surface 6 is now free.
  # derived_curvature_index is null to bypass LensTemplate validation;
  # the mid-surface solve is handled entirely by MidSolveLensProblem.
  free_curvature_indices: [0, 1, 2, 5, 6]
  derived_curvature_index: null
  focal_length_target_mm: null
  theta_bounds:
    - [-0.15, 0.15]    # c0
    - [-0.15, 0.15]    # c1
    - [-0.15, 0.15]    # c2
    - [-0.15, 0.15]    # c5
    - [-0.15, 0.15]    # c6
  stage: stage2
  num_rays: 512
  invalid_tol: 0.20
  invalid_penalty_weight: 5.0
  intersect_penalty_weight: 1.0
  air_min_mm: 0.1
  thick_min_mm: 0.5
  strict_entrance_pupil: true
  descriptor_field_index: 0

descriptor:
  kind: zernike
  params:
    noll_indices: [7, 11]
    num_rays: 512

algorithm:
  population_size: 16
  initial_sigma: 0.75
  cma_eta: 0.05
  cma_seed: 0
  seed_count: 1024
  calibration_count: 2048
  iterations: 4000
  new_cell_bonus: 1.0e6
  log_every: 50

archive:
  bins: [64, 64]
  bounds: null
  bound_calibration_pad: 0.05

io:
  results_dir: results/focal_experiments
  run_name: triplet_mid_solve
  checkpoint_every: 100
  device: auto
