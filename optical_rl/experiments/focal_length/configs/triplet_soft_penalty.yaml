# ============================================================================
# Experiment B: All-free surfaces + soft EFL penalty
# ============================================================================
# No derived surface.  All 6 curvature surfaces are free.  A soft quadratic
# penalty steers the system toward EFL = 50mm.  d_sensor is computed from
# the paraxial BFL.
#
# The key question: does removing the hard constraint give CMA-MEGA more
# freedom to explore genuinely different designs?

experiment:
  type: soft_penalty
  efl_target_mm: 50.0
  efl_penalty_weight: 10.0

problem:
  kind: lens
  lens_path: DeepLens/datasets/lenses/cooke.json
  wavelength_um: 0.587
  fitness_wavelengths_um: [0.656, 0.587, 0.486]
  object_depth_mm: -20000.0
  stop_surface_index: 4
  # ALL curvature surfaces are free — no derived surface.
  free_curvature_indices: [0, 1, 2, 3, 5, 6]
  derived_curvature_index: null
  focal_length_target_mm: null
  theta_bounds:
    - [-0.15, 0.15]    # c0
    - [-0.15, 0.15]    # c1
    - [-0.15, 0.15]    # c2
    - [-0.15, 0.15]    # c3
    - [-0.15, 0.15]    # c5
    - [-0.15, 0.15]    # c6
  stage: stage2
  num_rays: 512
  invalid_tol: 0.20
  invalid_penalty_weight: 5.0
  intersect_penalty_weight: 1.0
  air_min_mm: 0.1
  thick_min_mm: 0.5
  strict_entrance_pupil: true
  descriptor_field_index: 0

descriptor:
  kind: zernike
  params:
    noll_indices: [7, 11]
    num_rays: 512

algorithm:
  population_size: 16
  initial_sigma: 0.75
  cma_eta: 0.05
  cma_seed: 0
  seed_count: 1024
  calibration_count: 2048
  iterations: 4000
  new_cell_bonus: 1.0e6
  log_every: 50

archive:
  bins: [64, 64]
  bounds: null
  bound_calibration_pad: 0.05

io:
  results_dir: results/focal_experiments
  run_name: triplet_soft_penalty
  checkpoint_every: 100
  device: auto
