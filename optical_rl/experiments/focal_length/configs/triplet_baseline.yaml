# ============================================================================
# Baseline: Current last-surface solve (for comparison)
# ============================================================================
# Identical to triplet_discovery.yaml — surface 6 is derived.
# This is the control experiment.

problem:
  kind: lens
  lens_path: DeepLens/datasets/lenses/cooke.json
  wavelength_um: 0.587
  fitness_wavelengths_um: [0.656, 0.587, 0.486]
  object_depth_mm: -20000.0
  stop_surface_index: 4
  free_curvature_indices: [0, 1, 2, 3, 5]
  derived_curvature_index: 6
  focal_length_target_mm: 50.0
  theta_bounds:
    - [-0.15, 0.15]    # c0
    - [-0.15, 0.15]    # c1
    - [-0.15, 0.15]    # c2
    - [-0.15, 0.15]    # c3
    - [-0.15, 0.15]    # c5
  stage: stage2
  num_rays: 512
  invalid_tol: 0.20
  invalid_penalty_weight: 5.0
  intersect_penalty_weight: 1.0
  air_min_mm: 0.1
  thick_min_mm: 0.5
  strict_entrance_pupil: true
  descriptor_field_index: 0

descriptor:
  kind: zernike
  params:
    noll_indices: [7, 11]
    num_rays: 512

algorithm:
  population_size: 16
  initial_sigma: 0.75
  cma_eta: 0.05
  cma_seed: 0
  seed_count: 1024
  calibration_count: 2048
  iterations: 4000
  new_cell_bonus: 1.0e6
  log_every: 50

archive:
  bins: [64, 64]
  bounds: null
  bound_calibration_pad: 0.05

io:
  results_dir: results/focal_experiments
  run_name: triplet_baseline
  checkpoint_every: 100
  device: auto
