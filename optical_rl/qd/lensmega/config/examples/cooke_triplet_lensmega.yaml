problem:
  kind: lens
  lens_path: DeepLens/datasets/lenses/cooke.json
  wavelength_um: 0.587
  fitness_wavelengths_um: [0.587]
  object_depth_mm: -20000.0
  stop_surface_index: 4
  free_curvature_indices: [0, 1, 2, 3, 5]
  derived_curvature_index: 6
  focal_length_target_mm: 50.0
  theta_bounds:
    - [-0.08, 0.08]
    - [-0.08, 0.08]
    - [-0.08, 0.08]
    - [-0.08, 0.08]
    - [-0.08, 0.08]
  stage: stage1
  num_rays: 256
  invalid_tol: 0.2
  invalid_penalty_weight: 5.0
  intersect_penalty_weight: 1.0
  air_min_mm: 0.1
  thick_min_mm: 1.0
  strict_entrance_pupil: true
  descriptor_field_index: 0

descriptor:
  kind: zernike
  params:
    noll_indices: [7, 11]
    num_rays: 256

algorithm:
  population_size: 12
  initial_sigma: 0.75
  cma_eta: 0.05
  cma_seed: 0
  seed_count: 64
  calibration_count: 256
  iterations: 60
  new_cell_bonus: 1.0e6
  log_every: 1

archive:
  bins: [32, 32]
  bounds: null
  bound_calibration_pad: 0.05

io:
  results_dir: results/lensmega
  run_name: cooke_triplet_smoke
  checkpoint_every: 50
  device: auto
