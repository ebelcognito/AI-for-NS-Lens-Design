# ============================================================================
# Cooke Triplet — Discovery at FIXED F/3, MONOCHROMATIC fitness (d-line)
# ============================================================================
# Mono-λ variant of cooke_triplet_F3.yaml.  Only change: fitness wavelengths
# reduced from poly trio to [0.587] (d-line).  Used as the dimensional-scaling
# anchor for the new mono-λ headline (triplet -> sixlet -> septlet).

problem:
  kind: lens
  lens_path: /home/hisham26/Desktop/RL/DeepLens/datasets/lenses/cooke_smaller_ap_1mm.json
  wavelength_um: 0.587
  fitness_wavelengths_um: [0.587]
  object_depth_mm: -20000.0
  stop_surface_index: 4
  parameterization: full_dof

  free_curvature_indices: [0, 1, 2, 3, 5, 6]
  derived_curvature_index: null
  focal_length_target_mm: 35.0
  efl_penalty_weight: 10.0

  enforce_fnum: true
  f_number_target: 5.5
  fnum_penalty_weight: 1.0

  free_gap_indices: [0, 1, 2, 3, 4, 5]
  variable_flange: true
  variable_materials: true
  free_material_indices: [0, 1, 2]

  theta_bounds:
    # --- 6 curvatures ---
    - [-0.08, 0.08]      # c0  E1 front (crown)
    - [-0.08, 0.08]      # c1  E1 back
    - [-0.08, 0.08]      # c2  E2 front (flint)
    - [-0.08, 0.08]      # c3  E2 back
    - [-0.08, 0.08]      # c5  E3 front (crown)
    - [-0.08, 0.08]      # c6  E3 back
    # --- 6 gaps ---
    - [0.8, 3.2]         # g0  E1 thickness
    - [0.5, 10.0]        # g1  Air gap E1→E2
    - [0.8, 3.2]         # g2  E2 thickness
    - [0.5, 10.0]        # g3  Air gap E2→Stop
    - [0.5, 10.0]        # g4  Air gap Stop→E3
    - [0.8, 3.2]         # g5  E3 thickness
    # --- flange ---
    - [15.0, 32.0]       # flange
    # --- materials: (n, V) per element ---
    - [1.45, 1.85]       # n_0  E1 refractive index
    - [25, 75]           # V_0  E1 Abbe number
    - [1.45, 1.85]       # n_1  E2 refractive index
    - [25, 75]           # V_1  E2 Abbe number
    - [1.45, 1.85]       # n_2  E3 refractive index
    - [25, 75]           # V_2  E3 Abbe number

  stage: stage2
  num_rays: 256
  invalid_tol: 0.2
  invalid_penalty_weight: 5.0
  intersect_penalty_weight: 1.0
  air_min_mm: 0.1
  thick_min_mm: 0.5
  strict_entrance_pupil: false
  descriptor_field_index: 1

descriptor:
  kind: seidel
  params:
    terms: ["S2", "S3"]

algorithm:
  population_size: 18
  initial_sigma: 0.5
  cma_eta: 0.15
  cma_seed: 42
  seed_count: 1000
  calibration_count: 1000
  iterations: 200000
  new_cell_bonus: 1.0e6
  log_every: 50
  restart_patience: 3

archive:
  bins: [256, 256]
  bounds: [[-0.001, 0.001], [-0.001, 0.001]]
  bound_calibration_pad: 0.05

io:
  results_dir: results/lensmega
  run_name: cooke_triplet_F3_mono
  checkpoint_every: 200
  device: auto
  elite_fitness_threshold: -0.2
  refine_efl_penalty_weight: 20.0
  refine_invalid_penalty_weight: 10.0
  refine_intersect_penalty_weight: 2.0
  refine_fnum_penalty_weight: 1.0
  refine_lbfgs_max_steps: 100
  refine_lbfgs_lr: 0.5
  refine_converge_tol: 0.0001
  refine_field_weights: [1.0, 2.0, 4.0]
  refine_stability_samples: 20
  refine_stability_perturbation: 0.005
