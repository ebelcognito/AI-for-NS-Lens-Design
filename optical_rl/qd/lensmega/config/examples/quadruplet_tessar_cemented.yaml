# ============================================================================
# Quadruplet — Tessar with REAL cementing (glass-glass interface)
# ============================================================================
# Uses lens template quadruplet_tessar_50mm_f4.json (8 surfaces) where the
# back two elements are FUSED via a glass-glass interface at surface 6:
#   E1 (singlet): n-sk16   | surfaces 0, 1
#   E2 (singlet): n-sk16   | surfaces 2, 3
#   STOP                   | surface 4
#   E3+E4 (cemented):
#     E3 = f2  (flint)     | surfaces 5, 6
#     E4 = n-sk16 (crown)  | surfaces 6, 7
#   Surface 6 has mat1=f2, mat2=n-sk16  ←  THIS IS THE CEMENT INTERFACE
#
# Materials variable on E1 and E2 (singlets); the doublet glasses stay FIXED
# at f2/n-sk16 because the framework's continuous-glass element detector
# treats the doublet as one element (one (n,V) slot), so making it variable
# would force both halves to the same glass and defeat cementing's chromatic
# correction.

problem:
  kind: lens
  lens_path: /home/hisham26/Desktop/RL/DeepLens/datasets/lenses/quadruplet_tessar_50mm_f4.json
  wavelength_um: 0.587
  fitness_wavelengths_um: [0.486, 0.587, 0.656]
  object_depth_mm: -20000.0
  stop_surface_index: 4
  parameterization: full_dof

  # 7 free curvatures (skip stop at index 4)
  free_curvature_indices: [0, 1, 2, 3, 5, 6, 7]
  derived_curvature_index: null
  focal_length_target_mm: 50.0
  efl_penalty_weight: 10.0

  # 7 gaps (no air gap inside the cemented doublet — gaps 5 and 6 are E3 and
  # E4 element thicknesses)
  free_gap_indices: [0, 1, 2, 3, 4, 5, 6]
  variable_flange: true
  variable_materials: true
  free_material_indices: [0, 1]   # only the two singlets; doublet glasses fixed

  theta_bounds:
    # 7 curvatures (s0, s1, s2, s3, s5, s6, s7)
    - [-0.08, 0.08]      # c0   E1 front
    - [-0.08, 0.08]      # c1   E1 back
    - [-0.08, 0.08]      # c2   E2 front
    - [-0.08, 0.08]      # c3   E2 back
    - [-0.08, 0.08]      # c5   E3 front (doublet front element front)
    - [-0.08, 0.08]      # c6   CEMENT INTERFACE (f2 → n-sk16)
    - [-0.08, 0.08]      # c7   E4 back (doublet back element back)
    # 7 gaps
    - [0.8, 3.2]         # g0  E1 thickness
    - [0.5, 10.0]        # g1  air E1→E2
    - [0.8, 3.2]         # g2  E2 thickness
    - [0.5, 10.0]        # g3  air E2→stop
    - [0.5, 10.0]        # g4  air stop→E3
    - [0.8, 3.2]         # g5  E3 thickness (front element of cemented doublet)
    - [0.8, 3.2]         # g6  E4 thickness (back element of cemented doublet)
    # flange (last surface to sensor)
    - [25.0, 60.0]
    # 2 × (n, V) for the two singlets
    - [1.45, 1.85]      # n_0  E1
    - [25, 75]          # V_0  E1
    - [1.45, 1.85]      # n_1  E2
    - [25, 75]          # V_1  E2

  stage: stage2
  num_rays: 128
  invalid_tol: 0.2
  invalid_penalty_weight: 5.0
  intersect_penalty_weight: 1.0
  air_min_mm: 0.1
  thick_min_mm: 0.5
  strict_entrance_pupil: false
  descriptor_field_index: 2

descriptor:
  kind: seidel
  params:
    terms: ["S2", "S3"]

algorithm:
  population_size: 18
  initial_sigma: 0.5
  cma_eta: 0.1
  cma_seed: 42
  seed_count: 500
  calibration_count: 500
  iterations: 200000
  new_cell_bonus: 1.0e6
  log_every: 50
  restart_patience: 2

archive:
  bins: [256, 256]
  bounds: [[-0.001, 0.001], [-0.001, 0.001]]
  bound_calibration_pad: 0.05

io:
  results_dir: results/lensmega
  run_name: quadruplet_tessar_cemented
  checkpoint_every: 100
  device: auto
  elite_fitness_threshold: -0.4
  refine_lbfgs_max_steps: 100
  refine_lbfgs_lr: 0.5
  refine_converge_tol: 0.0001
  refine_stability_samples: 30
  refine_stability_perturbation: 0.005
