# ============================================================================
# Quadruplet — Full DOF Discovery with Variable Materials + Seidel BCs
# ============================================================================
# 4-element symmetric layout: crown-flint-stop-flint-crown
# 9 surfaces (8 refracting + 1 stop), 25-D theta
#
# Same as quadruplet_discovery.yaml but with continuous (n, V) per element.
# The optimizer jointly varies curvatures, gaps, flange, and glass materials.
# Catalog snapping happens at archive export time via match_materials().
#
# POLYCHROMATIC fitness (F, d, C lines).
# Seidel BCs (S2 coma vs S3 astigmatism).

problem:
  kind: lens
  lens_path: /home/hisham26/Desktop/RL/DeepLens/datasets/lenses/quadruplet_50mm_f4.json
  wavelength_um: 0.587
  fitness_wavelengths_um: [0.486, 0.587, 0.656]
  object_depth_mm: -20000.0
  stop_surface_index: 4
  parameterization: full_dof

  free_curvature_indices: [0, 1, 2, 3, 5, 6, 7, 8]
  derived_curvature_index: null
  focal_length_target_mm: 50.0
  efl_penalty_weight: 10.0

  free_gap_indices: [0, 1, 2, 3, 4, 5, 6, 7]
  variable_flange: true
  variable_materials: true
  free_material_indices: [0, 1, 2, 3]   # all 4 glass elements

  theta_bounds:
    # --- 8 curvatures: fully unconstrained ---
    - [-0.08, 0.08]      # c0  E1 front
    - [-0.08, 0.08]      # c1  E1 back
    - [-0.08, 0.08]      # c2  E2 front
    - [-0.08, 0.08]      # c3  E2 back
    - [-0.08, 0.08]      # c5  E3 front
    - [-0.08, 0.08]      # c6  E3 back
    - [-0.08, 0.08]      # c7  E4 front
    - [-0.08, 0.08]      # c8  E4 back
    # --- 8 gaps: physical manufacturing constraints ---
    - [0.8, 3.2]         # g0  E1 thickness
    - [0.5, 10.0]        # g1  Air gap E1→E2
    - [0.8, 3.2]         # g2  E2 thickness
    - [0.5, 10.0]        # g3  Air gap E2→Stop
    - [0.5, 10.0]        # g4  Air gap Stop→E3
    - [0.8, 3.2]         # g5  E3 thickness
    - [0.5, 10.0]        # g6  Air gap E3→E4
    - [0.8, 3.2]         # g7  E4 thickness
    # --- flange ---
    - [30.0, 60.0]       # flange (last surface to sensor)
    # --- materials: (n, V) per element ---
    - [1.45, 1.85]       # n_0  E1 refractive index
    - [25, 75]            # V_0  E1 Abbe number
    - [1.45, 1.85]       # n_1  E2 refractive index
    - [25, 75]            # V_1  E2 Abbe number
    - [1.45, 1.85]       # n_2  E3 refractive index
    - [25, 75]            # V_2  E3 Abbe number
    - [1.45, 1.85]       # n_3  E4 refractive index
    - [25, 75]            # V_3  E4 Abbe number

  stage: stage2
  num_rays: 128
  invalid_tol: 0.2
  invalid_penalty_weight: 5.0
  intersect_penalty_weight: 1.0
  air_min_mm: 0.1
  thick_min_mm: 0.5
  strict_entrance_pupil: false
  descriptor_field_index: 1

descriptor:
  kind: seidel
  params:
    terms: ["S2", "S3"]

algorithm:
  population_size: 18
  initial_sigma: 0.5
  cma_eta: 0.15
  cma_seed: 42
  seed_count: 500
  calibration_count: 500
  iterations: 200000
  new_cell_bonus: 1.0e6
  log_every: 50
  restart_patience: 3

archive:
  bins: [256, 256]
  bounds: [[-0.003, 0.003], [-0.001, 0.001]]
  bound_calibration_pad: 0.05

io:
  results_dir: results/lensmega
  run_name: quadruplet_discovery_materials
  checkpoint_every: 100
  device: auto
  elite_fitness_threshold: -0.8
  refine_lbfgs_max_steps: 100
  refine_lbfgs_lr: 0.5
  refine_converge_tol: 0.0001
  refine_stability_samples: 30
  refine_stability_perturbation: 0.005
