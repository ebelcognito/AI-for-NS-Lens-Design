# ============================================================================
# Cooke triplet — APS-C image circle (r_sensor=17 mm), EFL=85 mm, F/4
# ============================================================================
# Three-element Cooke (crown-flint-stop-crown) at APS-C scale. This is the
# *classic short-tele* Cooke regime — 75-100 mm Cookes on 35 mm cinema/still
# were the historical sweet spot for this template, before doublet-plus-
# triplet (Tessar / Heliar) topologies superseded them at wider field.
#
# Why these particular targets — and not the obvious port of the native
# Cooke (EFL=50, r_sensor=5.175) to APS-C with EFL=50 unchanged:
#
#   At fixed EFL=50, going from r_sensor=5.175 to 17 inflates third-order
#   aberrations by:    coma  x3.3  | astig/Petzval x10.8 | distortion x36
#   The triplet has only 5 free Seidels — at this level of severity, the
#   feasibility front collapses (mirrors the 0-elite cooke_triplet_F3
#   experiment, which was geometrically infeasible for an analogous
#   reason). Pushing EFL to 85 mm restores half-FoV to a tractable 11.3°
#   (vs 18.8° at EFL=50) — aberration severity is then ~3x the native
#   cooke baseline rather than ~10x.
#
# Topology (unchanged from the native cooke):
#   E1 (crown)  ->  E2 (flint)  ->  STOP  ->  E3 (crown)
#   7 surfaces (6 refracting + 1 stop), 19-D theta with materials variable.
#
# Spec summary:
#   EFL     = 85 mm  (soft-penalised)
#   F#      = 4.0    (soft-penalised)
#   sensor  = r=17 mm (APS-C-class image circle, 34 mm diagonal)
#   half-FoV at edge = 11.3 deg
#   marginal-ray radius at F/4 = 10.625 mm  -> stop r set to match
#   per-surface CA = 22 mm   (vs cooke base 7.5 mm — required at this scale)
#
# Curvature-bound rationale:
#   At EFL=85, equilibrium element powers are ~50% of the EFL=50 case, so
#   surface curvatures center near +/-0.02 (vs +/-0.03 at EFL=50). The
#   native cooke uses bounds +/-0.08 to give 4x headroom over the optimum.
#   Mirroring that 4x headroom here -> +/-0.05 (covers all native cooke
#   curvatures scaled by 50/85, plus 2x slack each side).
#
# BC choice (S2/S3) is matched to the native cooke baseline so triplet-vs-
# triplet comparisons land on the same descriptor coordinates. If you want
# to bias the search toward field-dominant aberrations at this regime,
# switch terms to ["S3", "S4"] — astigmatism and Petzval scale ~field^2
# and dominate the aberration budget at half-FoV 11°.
#
# Anticipated difficulty: meaningfully harder than the native cooke at
# r_sensor=5.175. Best refined RMS at this template will likely land in
# the 15-40 um range (cf. ~2.5 um native) until a Tessar-class cement
# topology (cooke + cemented rear pair) is introduced separately.

problem:
  kind: lens
  lens_path: /home/hisham26/Desktop/RL/DeepLens/datasets/lenses/cooke_apsc_85mm_f4.json
  wavelength_um: 0.587
  fitness_wavelengths_um: [0.486, 0.587, 0.656]
  object_depth_mm: -20000.0
  stop_surface_index: 4
  parameterization: full_dof

  free_curvature_indices: [0, 1, 2, 3, 5, 6]
  derived_curvature_index: null
  focal_length_target_mm: 85.0
  efl_penalty_weight: 10.0

  # --- F-number soft constraint ---------------------------------------------
  enforce_fnum: true
  f_number_target: 4.0
  fnum_penalty_weight: 1.0

  free_gap_indices: [0, 1, 2, 3, 4, 5]
  variable_flange: true
  variable_materials: true
  free_material_indices: [0, 1, 2]   # all 3 glass elements

  theta_bounds:
    # --- 6 curvatures: +/-0.05 (matches 4x-headroom recipe at EFL=85) ----
    - [-0.05, 0.05]      # c0  E1 front (crown)
    - [-0.05, 0.05]      # c1  E1 back
    - [-0.05, 0.05]      # c2  E2 front (flint)
    - [-0.05, 0.05]      # c3  E2 back
    - [-0.05, 0.05]      # c5  E3 front (crown)
    - [-0.05, 0.05]      # c6  E3 back
    # --- 6 gaps: scaled ~1.7x from native cooke bounds -------------------
    - [1.4, 6.0]         # g0  E1 thickness (crown)
    - [0.8, 17.0]        # g1  air gap E1 -> E2
    - [1.4, 4.5]         # g2  E2 thickness (flint, slightly thinner allowed)
    - [0.8, 17.0]        # g3  air gap E2 -> Stop
    - [0.8, 17.0]        # g4  air gap Stop -> E3
    - [1.4, 6.0]         # g5  E3 thickness (crown)
    # --- flange ---
    - [50.0, 110.0]      # last surface to sensor (longer EFL needs longer back focus)
    # --- materials: (n, V) per element (3 elements) ---
    - [1.45, 1.85]       # n_0  E1 refractive index
    - [25, 75]           # V_0  E1 Abbe number
    - [1.45, 1.85]       # n_1  E2
    - [25, 75]           # V_1
    - [1.45, 1.85]       # n_2  E3
    - [25, 75]           # V_2

  stage: stage2
  num_rays: 256
  invalid_tol: 0.2
  invalid_penalty_weight: 5.0
  intersect_penalty_weight: 1.0
  air_min_mm: 0.1
  thick_min_mm: 0.5
  strict_entrance_pupil: false
  descriptor_field_index: 1

descriptor:
  kind: seidel
  params:
    terms: ["S2", "S3"]
    # Chosen by uniform-theta calibration (calibrate_apsc_triplet_bcs.py,
    # 1000 samples, 483 valid). On this template the original suggestions
    # rank as: S4/S5 best (effrk 1.999, |corr| 0.05), S1/S4 second (effrk
    # 1.989, |corr| 0.15), S4/S2 7th (|corr| 0.35), S2/S3 9th (|corr|
    # 0.57), S3/S4 last (|corr| 0.77 — astig and Petzval collinear at
    # this template). S1/S4 picked over S4/S5 because S5 (distortion) is
    # a chief-ray-displacement axis, not a blur axis, so an S1/S4 archive
    # has two axes the spot-RMS loss directly cares about. Trade: ~5%
    # less plane fill than S4/S5 in exchange for theoretical cleanliness
    # and direct comparability with the third-order-blur literature.

algorithm:
  population_size: 18
  initial_sigma: 0.5
  cma_eta: 0.10                 # gentler than the old triplet default 0.15 — APS-C
                                # feasibility manifold is harder, big eta amplifies
                                # sigma blow-ups
  cma_seed: 42
  seed_count: 1500              # extra seeds for the wider feasibility manifold
  calibration_count: 1500
  iterations: 100000
  # --- anti-sigma-runaway stack (matches latest septlet APS-C) ----------------
  # Without these, corner-saturated CMA chases the new_cell_bonus into pathological
  # bc corners: insertions keep happening every gen so restart_patience never
  # trips, and best_fitness stays frozen for hundreds of gens while sigma
  # saturates the 1e10 clamp. Three knobs cooperate:
  new_cell_bonus: 20.0          # was 1.0e6 — that magnitude dwarfed the fitness
                                # signal and made BC corners more attractive than
                                # any optical correction.
  scale_bonus_by_fitness: true  # sigmoidally damp the bonus: new cell at
                                # fitness=-5 gets ~0 bonus, new cell at fitness=-0.05
                                # gets the full 20. Stops corner-chasing into
                                # pathological designs.
  bonus_fitness_threshold: -1.0
  bonus_fitness_scale: 2.0
  log_every: 50
  restart_patience: 3           # restart after N gens with zero insertions; matches
                                # septlet_apsc / septlet_F3 (was 5 in old triplet
                                # default).
  fitness_patience: 50          # *the* anti-sigma-runaway trigger: restart after
                                # 50 gens with no best-fitness improvement >= eps,
                                # even when corners keep filling. Schema default 0
                                # disables this — old cooke configs never had it.
  fitness_improve_eps: 1.0e-6

archive:
  bins: [256, 256]
  bounds: [[-0.0001, 0.0001], [-0.0001, 0.0001]]
  bound_calibration_pad: 0.05

io:
  results_dir: results/lensmega
  run_name: cooke_apsc_85mm_f4
  checkpoint_every: 100
  device: auto
  elite_fitness_threshold: -0.29
  refine_efl_penalty_weight: 0.0
  refine_invalid_penalty_weight: 0.0
  refine_intersect_penalty_weight: 2.0
  refine_fnum_penalty_weight: 0.0
  refine_lbfgs_max_steps: 200
  refine_lbfgs_lr: 0.05
  refine_converge_tol: 0.00008
  refine_field_weights: [1.0, 2.0, 16.0]
  refine_stability_samples: 5
  refine_stability_perturbation: 0.005
  # Per-generation log of theta_mu, +grad_fitness, and grad_M_j (raw, before
  # the unit-rescaling done by the emitter). Cheap (~MB-scale npz) and
  # enables post-hoc gradient-alignment analysis without re-running the
  # search. Replay against any descriptor via:
  #   experiments/gradient_alignment/posthoc_all_seidels.py
  #   experiments/gradient_alignment/posthoc_descriptor_compare.py
  log_gradients: true
