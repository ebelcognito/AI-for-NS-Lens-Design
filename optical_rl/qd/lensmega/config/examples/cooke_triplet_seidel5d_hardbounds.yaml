# ============================================================================
# Cooke Triplet — 5-D Seidel BC with HARDCODED BOUNDS (matching 2-D run)
# ============================================================================
# Same as cooke_triplet_seidel5d.yaml but archive.bounds is hardcoded to
# ±0.001 on every axis, matching the bounds of the successful 2-D Cooke run.
# This puts well-corrected designs in the centre of the grid rather than
# squashed into a corner.

problem:
  kind: lens
  lens_path: /home/hisham26/Desktop/RL/DeepLens/datasets/lenses/cooke_smaller_ap_1mm.json
  wavelength_um: 0.587
  fitness_wavelengths_um: [0.486, 0.587, 0.656]
  object_depth_mm: -20000.0
  stop_surface_index: 4
  parameterization: full_dof

  free_curvature_indices: [0, 1, 2, 3, 5, 6]
  derived_curvature_index: null
  focal_length_target_mm: 50.0
  efl_penalty_weight: 10.0

  free_gap_indices: [0, 1, 2, 3, 4, 5]
  variable_flange: true
  variable_materials: true
  free_material_indices: [0, 1, 2]

  theta_bounds:
    - [-0.08, 0.08]
    - [-0.08, 0.08]
    - [-0.08, 0.08]
    - [-0.08, 0.08]
    - [-0.08, 0.08]
    - [-0.08, 0.08]
    - [0.8, 3.2]
    - [0.5, 10.0]
    - [0.8, 3.2]
    - [0.5, 10.0]
    - [0.5, 10.0]
    - [0.8, 3.2]
    - [30.0, 65.0]
    - [1.45, 1.85]
    - [25, 75]
    - [1.45, 1.85]
    - [25, 75]
    - [1.45, 1.85]
    - [25, 75]

  stage: stage2
  num_rays: 256
  invalid_tol: 0.2
  invalid_penalty_weight: 5.0
  intersect_penalty_weight: 1.0
  air_min_mm: 0.1
  thick_min_mm: 0.5
  strict_entrance_pupil: false
  descriptor_field_index: 1

descriptor:
  kind: seidel
  params:
    terms: ["S1", "S2", "S3", "S4", "S5"]

algorithm:
  population_size: 18
  initial_sigma: 0.5
  cma_eta: 0.15
  cma_seed: 42
  seed_count: 3000
  calibration_count: 3000
  iterations: 50000
  new_cell_bonus: 1.0e6
  log_every: 50
  restart_patience: 5

archive:
  bins: [12, 12, 12, 12, 12]
  bounds:
    - [-0.001, 0.001]   # S1 spherical
    - [-0.001, 0.001]   # S2 coma
    - [-0.001, 0.001]   # S3 astigmatism
    - [-0.001, 0.001]   # S4 Petzval
    - [-0.001, 0.001]   # S5 distortion
  bound_calibration_pad: 0.05

io:
  results_dir: results/lensmega
  run_name: cooke_triplet_seidel5d_hardbounds
  checkpoint_every: 200
  device: auto
  elite_fitness_threshold: -0.2
  refine_efl_penalty_weight: 20.0
  refine_invalid_penalty_weight: 10.0
  refine_intersect_penalty_weight: 2.0
  refine_lbfgs_max_steps: 100
  refine_lbfgs_lr: 0.5
  refine_converge_tol: 0.0001
  refine_field_weights: [1.0, 2.0, 4.0]
  refine_stability_samples: 20
  refine_stability_perturbation: 0.005
