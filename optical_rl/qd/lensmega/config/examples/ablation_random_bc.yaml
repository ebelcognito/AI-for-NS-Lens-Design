# ============================================================================
# ABLATION: Random Projection BCs (CONTROL)
# ============================================================================
# Identical to the Seidel S2+S3 config EXCEPT the descriptor is a random
# linear projection of theta.  This tests whether ANY 2-D diversity
# maintenance helps, or whether Seidel-specific structure matters.
#
# The random projection is seeded (seed=12345) for reproducibility.
# Archive bounds are auto-calibrated from the projection.

problem:
  kind: lens
  lens_path: /home/hisham26/Desktop/RL/DeepLens/datasets/lenses/cooke_smaller_ap_1mm.json
  wavelength_um: 0.587
  fitness_wavelengths_um: [0.486, 0.587, 0.656]
  object_depth_mm: -20000.0
  stop_surface_index: 4
  parameterization: full_dof

  free_curvature_indices: [0, 1, 2, 3, 5, 6]
  derived_curvature_index: null
  focal_length_target_mm: 50.0
  efl_penalty_weight: 10.0

  free_gap_indices: [0, 1, 2, 3, 4, 5]
  variable_flange: true
  variable_materials: true
  free_material_indices: [0, 1, 2]

  theta_bounds:
    - [-0.08, 0.08]      # c0
    - [-0.08, 0.08]      # c1
    - [-0.08, 0.08]      # c2
    - [-0.08, 0.08]      # c3
    - [-0.08, 0.08]      # c5
    - [-0.08, 0.08]      # c6
    - [0.8, 3.2]         # g0
    - [0.5, 10.0]        # g1
    - [0.8, 3.2]         # g2
    - [0.5, 10.0]        # g3
    - [0.5, 10.0]        # g4
    - [0.8, 3.2]         # g5
    - [30.0, 65.0]       # flange
    - [1.45, 1.85]       # n_0
    - [25, 75]           # V_0
    - [1.45, 1.85]       # n_1
    - [25, 75]           # V_1
    - [1.45, 1.85]       # n_2
    - [25, 75]           # V_2

  stage: stage2
  num_rays: 256
  invalid_tol: 0.2
  invalid_penalty_weight: 5.0
  intersect_penalty_weight: 1.0
  air_min_mm: 0.1
  thick_min_mm: 0.5
  strict_entrance_pupil: false
  descriptor_field_index: 1

descriptor:
  kind: random
  params:
    dim: 2
    seed: 12345

algorithm:
  population_size: 18
  initial_sigma: 0.5
  cma_eta: 0.15
  cma_seed: 42
  seed_count: 1000
  calibration_count: 1000
  iterations: 50000
  new_cell_bonus: 1.0e6
  log_every: 50
  restart_patience: 2

archive:
  bins: [256, 256]
  bounds: [[-47.2, -18.8], [-21.0, 16.1]]
  bound_calibration_pad: 0.05

io:
  results_dir: results/lensmega
  run_name: ablation_random_bc
  checkpoint_every: 100
  device: auto
  elite_fitness_threshold: -0.2
  refine_efl_penalty_weight: 20.0
  refine_invalid_penalty_weight: 10.0
  refine_intersect_penalty_weight: 2.0
  refine_lbfgs_max_steps: 100
  refine_lbfgs_lr: 0.5
  refine_converge_tol: 0.0001
  refine_field_weights: [1.0, 2.0, 4.0]
  refine_stability_samples: 20
  refine_stability_perturbation: 0.005
