# ============================================================================
# Cooke Triplet QD Discovery Experiment
# ============================================================================
# Starting lens generated by DeepLens create_lens() with flat surfaces and
# random glasses (seed=42).  No reference patent design — this is genuine
# discovery from scratch, not refinement around a known optimum.
#
# Topology: 3 spherical elements + stop, 50mm f/4.0, 30° diagonal FOV.
# Glasses: n-sf11 / n-sk16 / n-bk7 (assigned by create_lens).
# 5 free curvatures + 1 derived (c6 enforces EFL = 50mm).
# ============================================================================

problem:
  kind: lens
  lens_path: optical_rl/qd/lensmega/config/examples/triplet_50mm_f4_flat.json
  wavelength_um: 0.587
  fitness_wavelengths_um: [0.656, 0.587, 0.486]
  object_depth_mm: -20000.0
  stop_surface_index: 4
  free_curvature_indices: [0, 1, 2, 3, 5]
  derived_curvature_index: 6
  focal_length_target_mm: 50.0

  # WIDE bounds, centered at zero.  The whole point: no reference design
  # baked into the search domain.  CMA-MEGA must discover good curvatures
  # from scratch, not polish a known solution.
  theta_bounds:
    - [-0.15, 0.15]    # c0
    - [-0.15, 0.15]    # c1
    - [-0.15, 0.15]    # c2
    - [-0.15, 0.15]    # c3
    - [-0.15, 0.15]    # c5

  stage: stage2
  num_rays: 512
  invalid_tol: 0.20
  invalid_penalty_weight: 5.0
  intersect_penalty_weight: 1.0
  air_min_mm: 0.1
  thick_min_mm: 0.5
  strict_entrance_pupil: true
  descriptor_field_index: 0

descriptor:
  kind: zernike
  params:
    noll_indices: [7, 11]
    num_rays: 512

algorithm:
  population_size: 16
  initial_sigma: 0.75
  cma_eta: 0.05
  cma_seed: 0
  seed_count: 1024
  calibration_count: 2048
  iterations: 16000
  new_cell_bonus: 1.0e6
  log_every: 50

archive:
  bins: [64, 64]
  bounds: null
  bound_calibration_pad: 0.05

io:
  results_dir: results/lensmega
  run_name: triplet_discovery_50mm_f4
  checkpoint_every: 100
  device: auto
